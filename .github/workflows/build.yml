name: Build Signed BitSawan Release

on:
  push:
    tags:
      - 'bitsawan-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitsawan-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      # Build in F-Droid's exact buildserver image so the from-source secp256k1
      # .so (and thus the whole APK) is byte-identical to F-Droid's reproducible
      # build. GitHub Actions (checkout/upload/release) run on the host because
      # the buildserver image ships no Node; only the build runs in the container.
      - name: Reproducible build (secp256k1 from source)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            -e KEYSTORE_BASE64 -e KEYSTORE_PASSWORD -e KEY_ALIAS -e KEY_PASSWORD \
            registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie \
            bash /repo/.github/reproducible-build.sh

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bitsawan-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/bitsawan-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bitsawan-release-${{ github.sha }}
          path: release-apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-apk/*.apk
          generate_release_notes: true
